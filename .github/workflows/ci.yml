name: CI

on: [push, pull_request]

jobs:
  # ---------------------------------------------------------------------------
  # Frontend - React + TypeScript (ESLint, Prettier, build, tests)
  # Skips gracefully when the frontend directory does not exist yet.
  # ---------------------------------------------------------------------------
  frontend:
    name: Frontend (Lint, Build & Test)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Detect frontend
        id: detect
        run: |
          if [ -f "Frontend/package.json" ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Frontend/package.json not found - skipping frontend checks."
          fi

      - name: Set up pnpm
        if: steps.detect.outputs.exists == 'true'
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Set up Node.js
        if: steps.detect.outputs.exists == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: Frontend/pnpm-lock.yaml

      - name: Install dependencies
        if: steps.detect.outputs.exists == 'true'
        run: pnpm install --frozen-lockfile --ignore-scripts
        working-directory: Frontend

      - name: Lint (ESLint + Prettier)
        if: steps.detect.outputs.exists == 'true'
        run: pnpm run lint
        working-directory: Frontend

      - name: Build
        if: steps.detect.outputs.exists == 'true'
        run: pnpm run build
        working-directory: Frontend

      - name: Test with coverage
        if: steps.detect.outputs.exists == 'true'
        run: pnpm run test:coverage
        working-directory: Frontend

      - name: Upload coverage report
        if: steps.detect.outputs.exists == 'true' && always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage
          path: Frontend/coverage/
          if-no-files-found: ignore

  # ---------------------------------------------------------------------------
  # Backend - ASP.NET Core + C# (lint, build & tests with Roslyn analyzers)
  # Skips gracefully when the backend directory does not exist yet.
  # ---------------------------------------------------------------------------
  backend:
    name: Backend (Lint, Build & Test)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Detect backend
        id: detect
        run: |
          if compgen -G "Backend/**/*.csproj" > /dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No .csproj found under Backend/ - skipping backend checks."
          fi

      - name: Set up .NET
        if: steps.detect.outputs.exists == 'true'
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        if: steps.detect.outputs.exists == 'true'
        run: dotnet restore
        working-directory: Backend

      - name: Install dotnet-format
        if: steps.detect.outputs.exists == 'true'
        run: dotnet tool install -g dotnet-format

      - name: Lint (dotnet format)
        if: steps.detect.outputs.exists == 'true'
        run: dotnet format Backend.csproj --verify-no-changes --no-restore --severity warn
        working-directory: Backend

      - name: Build (with analyzers)
        if: steps.detect.outputs.exists == 'true'
        run: dotnet build --no-restore --configuration Release /warnaserror
        working-directory: Backend

      - name: Test
        if: steps.detect.outputs.exists == 'true'
        run: dotnet test --no-build --configuration Release --logger "trx;LogFileName=results.trx"
        working-directory: Backend

      - name: Upload test results
        if: steps.detect.outputs.exists == 'true' && always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-results
          path: Backend/**/*.trx
          if-no-files-found: ignore
