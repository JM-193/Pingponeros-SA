name: CI

on: [push, pull_request]

jobs:
  # ---------------------------------------------------------------------------
  # Frontend – React + TypeScript (ESLint, Prettier, build, tests)
  # Skips gracefully when the frontend directory does not exist yet.
  # ---------------------------------------------------------------------------
  frontend:
    name: Frontend (Lint, Build & Test)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Detect frontend
        id: detect
        run: |
          if [ -f "frontend/package.json" ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "::notice::frontend/package.json not found – skipping frontend checks."
          fi

      - name: Set up Node.js
        if: steps.detect.outputs.exists == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        if: steps.detect.outputs.exists == 'true'
        run: npm ci
        working-directory: frontend

      - name: Lint (ESLint + Prettier)
        if: steps.detect.outputs.exists == 'true'
        run: npm run lint
        working-directory: frontend

      - name: Build
        if: steps.detect.outputs.exists == 'true'
        run: npm run build
        working-directory: frontend

      - name: Test
        if: steps.detect.outputs.exists == 'true'
        run: npm test -- --run
        working-directory: frontend

  # ---------------------------------------------------------------------------
  # Backend – ASP.NET Core + C# (build & tests with Roslyn analyzers)
  # Skips gracefully when the backend directory does not exist yet.
  # ---------------------------------------------------------------------------
  backend:
    name: Backend (Build & Test)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Detect backend
        id: detect
        run: |
          if compgen -G "backend/**/*.csproj" > /dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No .csproj found under backend/ – skipping backend checks."
          fi

      - name: Set up .NET
        if: steps.detect.outputs.exists == 'true'
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        if: steps.detect.outputs.exists == 'true'
        run: dotnet restore
        working-directory: backend

      - name: Build (with analyzers)
        if: steps.detect.outputs.exists == 'true'
        run: dotnet build --no-restore --configuration Release /warnaserror
        working-directory: backend

      - name: Test
        if: steps.detect.outputs.exists == 'true'
        run: dotnet test --no-build --configuration Release --logger "trx;LogFileName=results.trx"
        working-directory: backend

      - name: Upload test results
        if: steps.detect.outputs.exists == 'true' && always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-results
          path: backend/**/*.trx
          if-no-files-found: ignore
